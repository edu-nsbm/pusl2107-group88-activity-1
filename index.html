<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>Mini Museum: The Red Fox Exhibit</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>


    <script>
        AFRAME.registerComponent('change-color', {
            init: function () {
                var el = this.el;
                var colors = ['#EF2D5E', '#4CC3D9', '#FFC65D', '#7BC8A4', '#93648D', '#F9A826'];
                var i = 0;
                el.addEventListener('click', function () {
                    i = (i + 1) % colors.length;
                    el.setAttribute('color', colors[i]);
                });
            }
        });

        AFRAME.registerComponent('grow-on-tap', {
            schema: {
                factor: { type: 'number', default: 1.3 },
                steps:  { type: 'int',    default: 3 }
            },
            init: function () {
                var el = this.el;
                var data = this.data;
                var base = el.getAttribute('scale');
                var count = 0;
                el.addEventListener('click', function () {
                    count = (count + 1) % (data.steps + 1);
                    var f = Math.pow(data.factor, count);
                    el.setAttribute('scale', {
                        x: base.x * f,
                        y: base.y * f,
                        z: base.z * f
                    });
                });
            }
        });

        AFRAME.registerComponent('toggle-visible', {
            schema: { target: { type: 'selector' } },
            init: function () {
                var target = this.data.target;
                this.el.addEventListener('click', function () {
                    target.setAttribute('visible', !target.getAttribute('visible'));
                });
            }
        });
    </script>

</head>

<body style="margin: 0; overflow: hidden;">

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <a-asset-item id="fox" src="models/Fox.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro">

            <a-plane position="0 0 0" rotation="-90 0 0" width="1.8" height="1.8" color="#2C3E50"></a-plane>

            <a-cylinder position="0 0.1 0" radius="0.55" height="0.2" color="#7F8C8D"></a-cylinder>

            <a-entity class="clickable"
                      gltf-model="#fox"
                      animation-mixer="clip: Survey; loop: repeat"
                      position="0 0.2 0"
                      rotation="0 -35 0"
                      scale="0.005 0.005 0.005"
                      grow-on-tap="factor: 1.3; steps: 3"></a-entity>

            <a-torus position="0 0.6 0" rotation="90 0 0" radius="0.65" radius-tubular="0.012" color="#F1C40F"
                     animation="property: rotation; to: 90 360 0; dur: 6000; easing: linear; loop: true"></a-torus>

            <a-box position="0.7 0.15 -0.5" width="0.3" height="0.3" depth="0.3" color="#34495E"></a-box>

            <a-sphere class="clickable" position="0.7 0.5 -0.5" radius="0.13" color="#F9A826"
                      change-color
                      animation="property: position; from: 0.7 0.45 -0.5; to: 0.7 0.65 -0.5; dur: 1200; dir: alternate; easing: easeInOutSine; loop: true"></a-sphere>

            <a-box id="sign" class="clickable" position="-0.7 0.3 -0.5" width="0.5" height="0.35" depth="0.04" color="#ECF0F1"
                   toggle-visible="target: #caption"
                   animation="property: scale; from: 1 1 1; to: 1.08 1.08 1.08; dur: 1500; dir: alternate; easing: easeInOutSine; loop: true"></a-box>
            <a-text id="caption" value="Vulpes vulpes\nTap to hide me" position="-0.7 0.3 -0.47" align="center" width="1.2" color="#2C3E50"></a-text>

            <a-text value="Red Fox Exhibit" position="0 1.0 0" align="center" width="3" color="#FFFFFF"></a-text>

        </a-marker>

        <a-entity cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable"></a-entity>

        <a-entity camera></a-entity>

    </a-scene>

</body>

</html>
